name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q

      - name: Verify tables regenerate identically
        run: |
          uv run python scripts/generate_tables.py
          git diff --exit-code results/ \
            || (echo "results/ is stale -- regenerate and commit" && exit 1)
