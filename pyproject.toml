[project]
name = "attention-kv-cache-from-scratch"
version = "0.1.0"
description = "Attention and the KV cache implemented from first principles, with the memory arithmetic"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "torch>=2.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
# Declared so `uv sync` can install the project itself. Without it the project
# is unbuildable, uv skips it, and the declared dependencies are never
# installed -- which passes locally where they happen to be present and fails
# on a clean CI runner.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attn"]
